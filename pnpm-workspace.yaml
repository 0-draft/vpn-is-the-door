allowBuilds:
  esbuild: true
  sharp: false
overrides:
  # markdownlint (dev only) pulls katex 0.16: prototype-pollution advisory fixed in 0.18.2
  katex@<0.18.2: ">=0.18.2 <0.19"
  # markdownlint (dev only) pins re2js 2.8.6: GHSA-gg6h-894w-4m9c quadratic lookbehind, fixed in 2.8.7
  "re2js@>=2.2.0 <2.8.7": 2.8.8
  # satori (OG images, build only) pins fflate 0.7.4: GHSA infinite loop on malformed ZIP64
  "fflate@>=0.7.0 <0.7.5": 0.7.5
  # subset-font (font subsetting, build only) allows harfbuzzjs ^1.6.1; hold to a release older than two weeks
  "subset-font>harfbuzzjs": 1.6.3
  # lighthouse (dev only) pulls glob 13 via @sentry/bundler-plugins: GHSA-3g3m-2fjr-6pw4 (glob, fixed in 14.0.2)
  # and GHSA-g3hv-75wg-m249 (its minimatch 10, fixed in 11.0.1); glob 14 depends on minimatch ^11.0.2
  "glob@>=9.0.0 <14.0.2": 14.0.3

# A release must be 2 days old before it can enter the lockfile (minutes): most
# hijacked npm releases are pulled within hours. Dependabot adds a 7-day cooldown on
# top. Raise this once the lockfile has aged; pnpm checks every entry, not only new ones.
minimumReleaseAge: 2880
